<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Men's Collection - MeetCart</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #0b0f17; color: #f3f4f6; padding: 20px; text-align: center; }

    .header-nav { display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto 20px; }
    .back-btn { color: #f59e0b; text-decoration: none; font-weight: 600; font-size: 14px; }
    h1 { font-size: 24px; color: #fff; }

    /* Product Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; max-width: 1100px; margin: 0 auto; }
    .card { background: #131924; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); cursor: pointer; transition: 0.3s ease; text-align: left; }
    .card:hover { transform: translateY(-5px); border-color: #f59e0b; }
    .card img { width: 100%; height: 260px; object-fit: cover; }
    .card-info { padding: 15px; }
    .card-info h3 { font-size: 16px; margin-bottom: 6px; color: #fff; }
    .card-info .price { color: #f59e0b; font-weight: 700; font-size: 15px; margin-bottom: 10px; }
    .btn-view { display: block; text-align: center; background: rgba(255,255,255,0.08); color: #fff; padding: 8px; border-radius: 8px; font-size: 13px; font-weight: 600; }

    /* Product Details Popup Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); justify-content: center; align-items: center; padding: 15px; z-index: 1000; }
    .modal-content { background: #131924; border-radius: 18px; max-width: 400px; width: 100%; border: 1px solid rgba(255,255,255,0.15); overflow: hidden; position: relative; text-align: left; max-height: 90vh; overflow-y: auto; }
    .close-btn { position: absolute; top: 12px; right: 15px; font-size: 24px; color: #fff; cursor: pointer; background: rgba(0,0,0,0.5); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .modal-img { width: 100%; height: 280px; object-fit: cover; }
    .modal-body { padding: 20px; }
    .modal-title { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 6px; }
    .modal-price { font-size: 18px; color: #f59e0b; font-weight: 700; margin-bottom: 12px; }
    .modal-desc { font-size: 13px; color: #9ca3af; line-height: 1.6; margin-bottom: 20px; white-space: pre-line; }
    .btn-order { display: block; width: 100%; padding: 14px; background: #22c55e; color: #fff; text-align: center; text-decoration: none; font-weight: 700; border-radius: 10px; font-size: 15px; }
    .btn-order:hover { background: #16a34a; }
  </style>
</head>
<body>

  <div class="header-nav">
    <a href="index.html" class="back-btn">← Back to Home</a>
    <h1>Men's Collection</h1>
    <div style="width: 80px;"></div>
  </div>

  <!-- PRODUCTS LIST -->
  <div class="grid">

    <!-- Item 1: Popcorn Shirt (With Your Local Image) -->
    <div class="card" onclick="openProduct('Premium Popcorn Casual Shirt', '₹239 onwards', 'IMG_20260815_051821.png', '• Fabric: Imported Popcorn Knit (Wrinkle-Free)\n• Color: Mint Green\n• Style: Regular Casual Wear\n\n📌 Size & Price:\n• XXS - ₹239\n• M - ₹269\n• S - ₹289\n• L - ₹315\n• XL - ₹315\n• XXL - ₹315')">
      <img src="IMG_20260815_051821.jpg" alt="Popcorn Shirt">
      <div class="card-info">
        <h3>Premium Popcorn Casual Shirt</h3>
        <div class="price">₹239 onwards</div>
        <span class="btn-view">View Details & Order</span>
      </div>
    </div>

    <!-- Item 2: Royal Navy Blue Suit -->
    <div class="card" onclick="openProduct('Royal Navy Blue Suit', '₹2,999', 'https://images.unsplash.com/photo-1594938298603-c8148c4dae35?w=600', 'Premium 3-piece formal suit crafted with breathable fabric. Perfect for weddings, parties, and corporate events. Available in M, L, XL sizes.')">
      <img src="https://images.unsplash.com/photo-1594938298603-c8148c4dae35?w=600" alt="Suit">
      <div class="card-info">
        <h3>Royal Navy Blue Suit</h3>
        <div class="price">₹2,999</div>
        <span class="btn-view">View Details & Buy</span>
      </div>
    </div>

    <!-- Item 3: Casual Streetwear Jacket -->
    <div class="card" onclick="openProduct('Casual Streetwear Jacket', '₹1,499', 'https://images.unsplash.com/photo-1617137984095-74e4e5e3613f?w=600', 'Trendy slim-fit blazer combo. High quality cotton-blend material, super comfortable for daily & party wear.')">
      <img src="https://images.unsplash.com/photo-1617137984095-74e4e5e3613f?w=600" alt="Jacket">
      <div class="card-info">
        <h3>Casual Streetwear Jacket</h3>
        <div class="price">₹1,499</div>
        <span class="btn-view">View Details & Buy</span>
      </div>
    </div>

  </div>

  <!-- PRODUCT POPUP MODAL -->
  <div class="modal" id="productModal">
    <div class="modal-content">
      <div class="close-btn" onclick="closeProduct()">&times;</div>
      <img id="mImg" class="modal-img" src="" alt="Product">
      <div class="modal-body">
        <h2 id="mTitle" class="modal-title"></h2>
        <div id="mPrice" class="modal-price"></div>
        <p id="mDesc" class="modal-desc"></p>
        <a id="mOrderBtn" href="#" target="_blank" class="btn-order">Order on WhatsApp</a>
      </div>
    </div>
  </div>

  <script>
    const whatsappNum = "919251221747";

    function openProduct(title, price, img, desc) {
      document.getElementById('mTitle').innerText = title;
      document.getElementById('mPrice').innerText = price;
      document.getElementById('mImg').src = img;
      document.getElementById('mDesc').innerText = desc;

      const msg = `Hi! I want to order this product:%0A%0A*Item:* ${title}%0A*Price:* ${price}%0A%0A*Details:*%0A${desc}%0A%0APlease share details for confirmation.`;
      document.getElementById('mOrderBtn').href = `https://wa.me/${whatsappNum}?text=${encodeURIComponent(decodeURIComponent(msg))}`;

      document.getElementById('productModal').style.display = 'flex';
    }

    function closeProduct() {
      document.getElementById('productModal').style.display = 'none';
    }
  </script>
</body>
</html>
