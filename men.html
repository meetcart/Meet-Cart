<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Men's Collection - MeetCart</title>
  <style>
    body { font-family: sans-serif; background: #0b0f17; color: white; padding: 20px; text-align: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
    .card { background: #131924; border-radius: 10px; padding: 15px; border: 1px solid #1f2937; }
    .card img { width: 100%; height: 250px; object-fit: cover; border-radius: 8px; }
    .btn { display: inline-block; margin-top: 10px; padding: 8px 15px; background: #9f7706; color: white; text-decoration: none; border-radius: 5px; }
    .back-btn { display: inline-block; margin-bottom: 20px; color: #9f7706; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">← Back to Home</a>
  <h1>Men's Collection</h1>

  <div class="grid">
    <div class="card">
      <img src="https://images.unsplash.com/photo-1594938298603-c8148c4dae35?auto=format&fit=crop&w=600&q=80" alt="Suit">
      <h3>Formal Men Suit</h3>
      <p>₹2,999</p>
      <a href="#" class="btn">Buy Now</a>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1617137984095-74e4e5e3613f?auto=format&fit=crop&w=600&q=80" alt="Casual">
      <h3>Casual Jacket & Shirt</h3>
      <p>₹1,499</p>
      <a href="#" class="btn">Buy Now</a>
    </div>
  </div>

</body>
</html>
