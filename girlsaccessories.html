<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Girl's Accessories - MeetCart</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #0b0f17; color: #f3f4f6; padding: 15px 10px; text-align: center; }

    .header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; padding: 0 5px; }
    .back-btn { color: #f59e0b; text-decoration: none; font-weight: 600; font-size: 13px; }
    h1 { font-size: 20px; color: #fff; }

    /* Grid */
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 1000px; margin: 0 auto; }
    .card { background: #131924; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); cursor: pointer; text-align: left; display: flex; flex-direction: column; justify-content: space-between; }
    .card img { width: 100%; height: 180px; object-fit: contain; background: #080c13; display: block; }
    .card-info { padding: 10px; }
    .card-info h3 { font-size: 13px; margin-bottom: 4px; color: #fff; line-height: 1.3; font-weight: 600; }
    .card-info .price { color: #f59e0b; font-weight: 700; font-size: 13px; margin-bottom: 8px; }
    .btn-view { display: block; text-align: center; background: rgba(255,255,255,0.06); color: #fff; padding: 6px 4px; border-radius: 6px; font-size: 11px; font-weight: 600; }

    /* Modal Popup */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); backdrop-filter: blur(8px); justify-content: center; align-items: center; padding: 15px; z-index: 1000; }
    .modal-content { background: #131924; border-radius: 16px; max-width: 380px; width: 100%; border: 1px solid rgba(255,255,255,0.15); overflow: hidden; position: relative; text-align: left; max-height: 90vh; overflow-y: auto; }
    .close-btn { position: absolute; top: 10px; right: 12px; font-size: 22px; color: #fff; cursor: pointer; background: rgba(0,0,0,0.6); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 10; }
    
    .modal-img { width: 100%; max-height: 320px; object-fit: contain; background: #080c13; display: block; }
    .modal-body { padding: 18px; }
    .modal-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .modal-price { font-size: 16px; color: #f59e0b; font-weight: 700; margin-bottom: 12px; }
    .modal-desc { font-size: 13px; color: #9ca3af; line-height: 1.5; margin-bottom: 16px; }
    .btn-order { display: block; width: 100%; padding: 12px; background: #22c55e; color: #fff; text-align: center; text-decoration: none; font-weight: 700; border-radius: 8px; font-size: 14px; }
  </style>
</head>
<body>

  <div class="header-nav">
    <a href="index.html" class="back-btn">← Back to Home</a>
    <h1>Girl's Accessories</h1>
    <div style="width: 60px;"></div>
  </div>

  <div class="grid" id="productGrid"></div>

  <div class="modal" id="productModal">
    <div class="modal-content">
      <div class="close-btn" onclick="closeProduct()">&times;</div>
      <img id="mImg" class="modal-img" src="" alt="Product">
      <div class="modal-body">
        <h2 id="mTitle" class="modal-title"></h2>
        <div id="mPrice" class="modal-price"></div>
        <div id="mDesc" class="modal-desc"></div>
        <a id="mOrderBtn" href="#" target="_blank" class="btn-order">Order on WhatsApp</a>
      </div>
    </div>
  </div>

  <script>
    const whatsappNum = "919251221747";
    
    const products = {
      1: { 
        code: "GA-101",
        title: "Combo of 12 Pair Earrings with Velvet Box", 
        price: "₹673", 
        img: "https://i.ibb.co/Ld0X8PQv/Screenshot-2026-0816-064613.jpg", 
        desc: "• Type: Jhumkhas (12 Pair Combo)<br>• Trend: Floral, Oxidised Silver<br>• Material: Alloy with Artificial Stones & Beads<br>• Occasion: Ethnic Party Wear<br>• Includes: Velvet Earrings Folding Box" 
      },
      2: { 
        code: "GA-102",
        title: "Vintage Floral Embroidered Lace Hair Bow", 
        price: "₹150", 
        img: "https://i.ibb.co/TBQ2DcYN/IMG-20260817-114459.png", 
        desc: "• Type: Aesthetic Lace Hair Bow / Bun Clip<br>• Trend: Vintage Floral Embroidery with Pearl Accents<br>• Material: Premium Fabric & Lace<br>• Color: White Floral<br>• Occasion: Partywear & Everyday Aesthetic Look" 
      },
      3: { 
        code: "GA-103",
        title: "LED Light Up Butterfly Hair Clip (Pack of 2)", 
        price: "₹199", 
        img: "https://i.ibb.co/mVgrwGCz/IMG-20260817-121041.jpg", 
        desc: "• Type: Creative LED Flashing Hair Clip (Pack of 2)<br>• Feature: Glowing Optical Fiber Butterfly Braid<br>• Color: Multicolor Light<br>• Occasion: Parties, Concerts, Festivals & Night Styling" 
      },
      4: { 
        code: "GA-104",
        title: "Exquisite Princess Pearl Butterfly Tiara Crown", 
        price: "₹349", 
        img: "https://i.ibb.co/DPsmtDdc/IMG-20260817-124016.jpg", 
        desc: "• Type: Princess Tiara Crown / Hair Band<br>• Design: Pearl & Butterfly Embellishments<br>• Material: High-Grade Metal Alloy<br>• Color: White / Silver Finish<br>• Occasion: Birthdays, Parties, Weddings & Festive Styling" 
      },
      5: { 
        code: "GA-105",
        title: "12 Pcs Kids Rainbow Braids Hair Clip-in Extensions", 
        price: "₹199", 
        img: "https://i.ibb.co/C5whJn3n/IMG-20260817-130237.jpg", 
        desc: "• Type: Clip-In Hair Extensions (Pack of 12)<br>• Style: Colorful Rainbow Braids<br>• Material: Silicone Clips & Synthetic Braids<br>• Color: Vibrant Multicolor<br>• Occasion: Parties, School Events, Styling & Everyday Fashion" 
      },
      6: { 
        code: "GA-106",
        title: "Soft Fur Scrunchies Combo (Pack of 8)", 
        price: "₹149", 
        img: "https://i.ibb.co/qYP8Tszc/IMG-20260818-120223.jpg", 
        desc: "• Type: Elastic Fur Scrunchies (Pack of 8)<br>• Material: Ultra-Soft Plush Fur & Elastic Fabric<br>• Color: Multicolor Pastel & Solid Mix<br>• Feature: Gentle on hair, prevents breakage & stylish aesthetic look<br>• Occasion: Daily Use, College & Casual Outings" 
      }
    };

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';
      for (let id in products) {
        grid.innerHTML += `<div class="card" onclick="openProduct(${id})">
          <img src="${products[id].img}" alt="${products[id].title}">
          <div class="card-info">
            <h3>${products[id].title}</h3>
            <div class="price">${products[id].price}</div>
            <span class="btn-view">View Details</span>
          </div>
        </div>`;
      }
    }

    function openProduct(id) {
      const p = products[id];
      document.getElementById('mTitle').innerText = p.title;
      document.getElementById('mPrice').innerText = p.price;
      document.getElementById('mImg').src = p.img;
      document.getElementById('mDesc').innerHTML = p.desc;
      
      const plainDesc = p.desc.replace(/<br>/g, "\n").replace(/<\/?[^>]+(>|$)/g, "");
      
      const msg = 
        `*NEW ORDER INQUIRY*\n\n` +
        `*Product Code:* ${p.code}\n` +
        `*Item:* ${p.title}\n` +
        `*Price:* ${p.price}\n\n` +
        `*Product Photo:* ${p.img}\n\n` +
        `*Details:*\n${plainDesc}\n\n` +
        `Please confirm availability & delivery.`;
      
      document.getElementById('mOrderBtn').href = `https://wa.me/${whatsappNum}?text=${encodeURIComponent(msg)}`;
      document.getElementById('productModal').style.display = 'flex';
    }

    function closeProduct() { document.getElementById('productModal').style.display = 'none'; }
    renderProducts();
  </script>
</body>
</html>
