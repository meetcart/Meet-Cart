<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boy's Accessories - MeetCart</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #0b0f17; color: #f3f4f6; padding: 15px 10px 40px; text-align: center; }

    .header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; padding: 0 5px; }
    .back-btn { color: #f59e0b; text-decoration: none; font-weight: 600; font-size: 13px; }
    h1 { font-size: 20px; color: #fff; }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 1000px; margin: 0 auto; }
    .card { background: #131924; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); cursor: pointer; text-align: left; display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s; user-select: none; }
    .card:hover { transform: translateY(-4px); border-color: rgba(245, 158, 11, 0.4); }
    
    .card-img-wrapper { width: 100%; height: 180px; overflow: hidden; background: #080c13; display: flex; align-items: center; justify-content: center; }
    .card-img-wrapper img { width: 100%; height: 100%; object-fit: contain; display: block; padding: 4px; }
    
    .card-info { padding: 12px 10px; }
    .card-info h3 { font-size: 13px; margin-bottom: 4px; color: #fff; font-weight: 600; line-height: 1.3; }
    .card-info .price { color: #f59e0b; font-weight: 700; font-size: 13px; margin-bottom: 8px; }
    .btn-view { display: block; text-align: center; background: #f59e0b; color: #0b0f17; padding: 8px 4px; border-radius: 6px; font-size: 11.5px; font-weight: 700; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); justify-content: center; align-items: center; padding: 12px; z-index: 1000; animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-content { background: #131924; border-radius: 18px; max-width: 420px; width: 100%; border: 1px solid rgba(255,255,255,0.12); overflow: hidden; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.6); max-height: 92vh; overflow-y: auto; }
    .close-btn { position: absolute; top: 12px; right: 12px; font-size: 20px; color: #fff; cursor: pointer; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 10; border: 1px solid rgba(255,255,255,0.2); }
    
    /* Improved Image Fit: Contain ensures NO cropping */
    .modal-img-container { width: 100%; background: #000; min-height: 250px; display: flex; align-items: center; justify-content: center; }
    .modal-img { max-width: 100%; height: auto; max-height: 400px; object-fit: contain; display: block; }
    
    .modal-body { padding: 18px; text-align: left; }
    .modal-title { font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 4px; line-height: 1.3; }
    .modal-price { font-size: 18px; color: #f59e0b; font-weight: 700; margin-bottom: 12px; }
    .modal-desc { font-size: 12.5px; color: #9ca3af; line-height: 1.5; margin-bottom: 18px; background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
    .btn-order-now { display: block; width: 100%; padding: 13px; background: #f59e0b; color: #0b0f17; font-weight: 700; border-radius: 10px; border: none; cursor: pointer; font-size: 14px; }

    .form-modal-body { padding: 22px 18px; text-align: left; }
    .mini-product-card { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.04); padding: 10px; border-radius: 12px; margin-bottom: 14px; border: 1px solid rgba(255,255,255,0.08); }
    .mini-product-card img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; background: #080c13; }
    .qty-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); padding: 10px 15px; border-radius: 10px; margin-bottom: 14px; border: 1px solid rgba(255,255,255,0.06); }
    .qty-btn { width: 32px; height: 32px; background: rgba(255,255,255,0.1); border: none; color: #fff; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .form-group { margin-bottom: 12px; }
    .form-group label { font-size: 11.5px; font-weight: 600; color: #9ca3af; display: block; margin-bottom: 5px; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px; background: #0b0f17; color: #fff; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; font-size: 13px; outline: none; }
    .form-group input:focus, .form-group textarea:focus { border-color: #f59e0b; }
    .btn-submit-wa { width: 100%; padding: 14px; background: #22c55e; color: #fff; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 10px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="header-nav">
    <a href="index.html" class="back-btn">← Back to Home</a>
    <h1>Boy's Accessories</h1>
    <div style="width: 60px;"></div>
  </div>

  <div class="grid" id="productGrid"></div>

  <!-- Modal 1: Product Details -->
  <div class="modal" id="productModal">
    <div class="modal-content">
      <div class="close-btn" onclick="document.getElementById('productModal').style.display='none'">&times;</div>
      <div class="modal-img-container">
        <img id="mImg" class="modal-img" src="" alt="Product">
      </div>
      <div class="modal-body">
        <h2 id="mTitle" class="modal-title"></h2>
        <div id="mPrice" class="modal-price"></div>
        <div id="mDesc" class="modal-desc"></div>
        <button class="btn-order-now" onclick="openForm()">Order Now</button>
      </div>
    </div>
  </div>

  <!-- Modal 2: Delivery Details Form -->
  <div class="modal" id="orderFormModal">
    <div class="modal-content">
      <div class="close-btn" onclick="document.getElementById('orderFormModal').style.display='none'">&times;</div>
      <div class="form-modal-body">
        <h3 style="margin-bottom: 14px; text-align: center;">Confirm Order</h3>
        <div class="mini-product-card">
          <img id="miniImg" src="" alt="Thumbnail">
          <div class="mini-card-info">
            <h4 id="miniTitle"></h4>
            <div id="miniPriceUnit" style="color: #f59e0b; font-weight: 700; font-size: 13px;"></div>
          </div>
        </div>
        <div class="qty-row">
            <span style="font-size:13px; font-weight:600;">Quantity:</span>
            <div style="display:flex; align-items:center; gap:10px;">
                <button class="qty-btn" onclick="updateQty(-1)">−</button>
                <span id="qtyVal" style="font-weight:700;">1</span>
                <button class="qty-btn" onclick="updateQty(1)">+</button>
            </div>
        </div>
        <div class="form-group"><label>Full Name *</label><input type="text" id="custName" placeholder="Enter full name"></div>
        <div class="form-group"><label>Mobile Number *</label><input type="tel" id="custPhone" placeholder="10-digit mobile number"></div>
        <div class="form-group"><label>Delivery Address *</label><textarea id="custAddress" rows="2" placeholder="House no, Area, City"></textarea></div>
        <div class="form-group"><label>Pincode *</label><input type="text" id="custPincode" placeholder="6-digit pincode"></div>
        <button class="btn-submit-wa" onclick="submitOrder()">Confirm & Order on WhatsApp</button>
      </div>
    </div>
  </div>

  <script>
    const whatsappNum = "919251221747";
    let selectedQuantity = 1;
    let currentId = null;
    
    // Yahan saare 12 products hain
    const products = { 
      1: { code: "BA-101", title: "Pina Colada Attar 6ml Pack of 2", priceNum: 299, price: "₹299", img: "https://i.ibb.co/4ZwFRcth/Screenshot-2026-0820-184205.jpg", desc: "• Pack: 2 Bottles (6ml each)<br>• Flavour: Strawberry & Pina Colada<br>• Type: Non-Alcoholic Unisex Attar" },
      2: { code: "BA-102", title: "Classy Men Silver Plated Designer Bracelet", priceNum: 149, price: "₹149", img: "https://iili.io/CZ2bBII.md.jpg", desc: "• Material: Stainless Steel<br>• Color: Premium Silver<br>• Occasion: Daily Wear" },
      3: { code: "BA-103", title: "Men's Designer Gold Plated Bracelet", priceNum: 299, price: "₹299", img: "https://iili.io/CZ3LxzF.md.jpg", desc: "• Material: Brass Base Metal<br>• Stone: Amethyst Stone<br>• Size: 2-12 (Non-Adjustable)" },
      4: { code: "BA-104", title: "Men's Magnetic Chain Bracelet (2pc Set)", priceNum: 199, price: "₹199", img: "https://iili.io/CZ3ZhD7.md.jpg", desc: "• Material: Silver Plated Alloy<br>• Size: 2-10 (Adjustable)<br>• Closure: Hook Lock" },
      5: { code: "BA-105", title: "Men's Silver Plated Charm Bracelet", priceNum: 299, price: "₹299", img: "https://iili.io/CZ3bCo7.md.jpg", desc: "• Material: Stainless Steel<br>• Length: 20cm<br>• Closure: Foldover Clasp" },
      6: { code: "BA-106", title: "Men's Brass Gold Plated Kada Bracelet", priceNum: 249, price: "₹249", img: "https://iili.io/CZ3yzKX.md.jpg", desc: "• Material: Brass Base Metal<br>• Size: 2-12 (8-inch)<br>• Style: Solid Design" },
      7: { code: "BA-107", title: "SIXER PRO Double Blade Cricket Bat", priceNum: 399, price: "₹399", img: "https://iili.io/CZF2scP.md.jpg", desc: "• Material: Hard Plastic<br>• Type: Tennis Ball Cricket" },
      8: { code: "BA-108", title: "Men's Black Analog-Digital Sport Watch", priceNum: 249, price: "₹249", img: "https://iili.io/CZFC2Ul.md.jpg", desc: "• Style: Dual Analog-Digital<br>• Features: Date & LED Light<br>• Strap: Rubber" },
      9: { code: "BA-109", title: "Unisex Sleek Black Digital Watch", priceNum: 280, price: "₹280", img: "https://iili.io/CZFuQwl.md.jpg", desc: "• Type: Digital Display<br>• Strap: Silicone Bracelet<br>• Style: Minimalist" },
      10: { code: "BA-110", title: "Men's Matte Black Analog Watch", priceNum: 295, price: "₹295", img: "https://iili.io/CZF5nyJ.md.jpg", desc: "• Dial: 35mm Round Dial<br>• Durability: Shock-Resistant<br>• Strap: Soft Silicone" },
      11: { code: "BA-111", title: "Men's Classic Silver Steel Analog Watch", priceNum: 299, price: "₹299", img: "https://iili.io/CZFYosp.md.jpg", desc: "• Dial: 30mm Black Dial<br>• Chain: Silver Steel Link<br>• Closure: Fold Clasp" },
      12: { code: "BA-112", title: "Men's Multi-Strand Black Leather Bracelet", priceNum: 199, price: "₹199", img: "https://iili.io/CZFjunt.md.jpg", desc: "• Material: Leather & Alloy<br>• Size: Adjustable Slip-On" },
      13: { code: "BA-113", title: "Crozon Premium Handkerchief (Pack of 6)", priceNum: 269, price: "₹269", img: "https://i.ibb.co/68v1r52/1000459580.jpg", desc: "• Material: 100% Cotton (Soft)<br>• Quantity: Pack of 6<br>• Size: 43cm x 43cm<br>• Pattern: Striped" },
      14: { code: "BA-114", title: "Unisex Outdoor Tactical Bucket Hat", priceNum: 258, price: "₹258", img: "https://i.ibb.co/1Jq0d2y/1000459548.jpg", desc: "• Size: 56-58cm (Adjustable)<br>• Features: Air Eyelets, Windproof String<br>• Occasion: Summer Travel & Outdoor" }
    };

    function render() {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = '';
        for (let id in products) {
            grid.innerHTML += `<div class="card" onclick="openModal(${id})">
              <div class="card-img-wrapper"><img src="${products[id].img}" alt="${products[id].title}"></div>
              <div class="card-info">
                <h3>${products[id].title}</h3>
                <div class="price">${products[id].price}</div>
                <span class="btn-view">View Details</span>
              </div>
            </div>`;
        }
    }

    function openModal(id) { 
        currentId = id; 
        document.getElementById('mImg').src = products[id].img; 
        document.getElementById('mTitle').innerText = products[id].title; 
        document.getElementById('mPrice').innerText = products[id].price; 
        document.getElementById('mDesc').innerHTML = products[id].desc; 
        document.getElementById('productModal').style.display = 'flex'; 
    }

    function openForm() { 
        document.getElementById('productModal').style.display = 'none'; 
        document.getElementById('orderFormModal').style.display = 'flex'; 
        document.getElementById('miniImg').src = products[currentId].img; 
        document.getElementById('miniTitle').innerText = products[currentId].title; 
        document.getElementById('miniPriceUnit').innerText = products[currentId].price; 
    }

    function updateQty(c) { 
        selectedQuantity = Math.max(1, Math.min(20, selectedQuantity + c)); 
        document.getElementById('qtyVal').innerText = selectedQuantity; 
    }

    function submitOrder() {
        const p = products[currentId];
        const name = document.getElementById('custName').value.trim();
        const phone = document.getElementById('custPhone').value.trim();
        const address = document.getElementById('custAddress').value.trim();
        const pin = document.getElementById('custPincode').value.trim();

        if (!name || !phone || !address || !pin) {
            alert("Please fill all required details.");
            return;
        }

        const total = p.priceNum * selectedQuantity;
        
        const msg = `*NEW ORDER PLACED*\n\n` +
            `*Product Code:* ${p.code}\n` +
            `*Item:* ${p.title}\n` +
            `*Unit Price:* ${p.price}\n` +
            `*Quantity:* ${selectedQuantity}\n` +
            `*Total Amount:* ₹${total}\n` +
            `*Product Photo:* ${p.img}\n\n` +
            `*Customer Details:*\n` +
            `• *Name:* ${name}\n` +
            `• *Phone:* ${phone}\n` +
            `• *Delivery Address:* ${address}\n` +
            `• *Pincode:* ${pin}\n\n` +
            `Please confirm my order & send delivery details.`;
            
        window.open(`https://wa.me/${whatsappNum}?text=${encodeURIComponent(msg)}`, '_blank');
        document.getElementById('orderFormModal').style.display = 'none';
    }

    render();
  </script>
</body>
</html>
