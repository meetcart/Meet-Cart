<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boy's Accessories - MeetCart</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #0b0f17; color: #f3f4f6; padding: 15px 10px 40px; text-align: center; }

    .header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; padding: 0 5px; }
    .back-btn { color: #f59e0b; text-decoration: none; font-weight: 600; font-size: 13px; }
    h1 { font-size: 20px; color: #fff; }

    /* 2 Column Grid */
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 1000px; margin: 0 auto; }
    .card { background: #131924; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); cursor: pointer; text-align: left; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s ease, border-color 0.2s ease; user-select: none; }
    .card:hover { transform: translateY(-4px); border-color: rgba(245, 158, 11, 0.4); }
    .card img { width: 100%; height: 200px; object-fit: contain; background: #080c13; display: block; cursor: pointer; padding: 4px; }
    .card-info { padding: 10px; }
    .card-info h3 { font-size: 13px; margin-bottom: 4px; color: #fff; line-height: 1.3; font-weight: 600; }
    .card-info .price { color: #f59e0b; font-weight: 700; font-size: 13px; margin-bottom: 8px; }
    
    .btn-view { display: block; text-align: center; background: #f59e0b; color: #0b0f17; padding: 7px 4px; border-radius: 6px; font-size: 11.5px; font-weight: 700; transition: background 0.2s; }
    .card:hover .btn-view { background: #d97706; }

    /* Modal Styling */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); justify-content: center; align-items: center; padding: 15px; z-index: 1000; animation: fadeIn 0.2s ease-out; }
    .modal-content { background: #131924; border-radius: 18px; max-width: 390px; width: 100%; border: 1px solid rgba(255,255,255,0.12); overflow: hidden; position: relative; text-align: left; box-shadow: 0 20px 40px rgba(0,0,0,0.6); max-height: 90vh; overflow-y: auto; }
    .close-btn { position: absolute; top: 12px; right: 12px; font-size: 20px; color: #fff; cursor: pointer; background: rgba(0,0,0,0.6); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 10; }
    .modal-img { width: 100%; height: 300px; object-fit: contain; background: #080c13; display: block; padding: 6px; }
    .modal-body { padding: 18px; }
    .modal-title { font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 4px; line-height: 1.3; }
    .modal-price { font-size: 18px; color: #f59e0b; font-weight: 700; margin-bottom: 12px; }
    .modal-desc { font-size: 12.5px; color: #9ca3af; line-height: 1.5; margin-bottom: 18px; background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
    .btn-order-now { display: block; width: 100%; padding: 13px; background: #f59e0b; color: #0b0f17; text-align: center; font-weight: 700; border-radius: 10px; font-size: 14px; border: none; cursor: pointer; }

    .form-modal-body { padding: 22px 18px; }
    .mini-product-card { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.04); padding: 10px; border-radius: 12px; margin-bottom: 14px; }
    .mini-product-card img { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; }
    .qty-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); padding: 10px 12px; border-radius: 10px; margin-bottom: 14px; }
    .form-group input, .form-group textarea { width: 100%; padding: 9px 10px; background: #0b0f17; color: #fff; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; font-size: 12.5px; }
    .btn-submit-wa { width: 100%; padding: 12px; background: #22c55e; color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="header-nav">
    <a href="index.html" class="back-btn">← Back to Home</a>
    <h1>Boy's Accessories</h1>
    <div style="width: 60px;"></div>
  </div>

  <div class="grid" id="productGrid"></div>

  <!-- Modal 1 -->
  <div class="modal" id="productModal">
    <div class="modal-content">
      <div class="close-btn" onclick="document.getElementById('productModal').style.display='none'">&times;</div>
      <img id="mImg" class="modal-img">
      <div class="modal-body">
        <h2 id="mTitle" class="modal-title"></h2>
        <div id="mPrice" class="modal-price"></div>
        <div id="mDesc" class="modal-desc"></div>
        <button class="btn-order-now" onclick="openForm()">Order Now</button>
      </div>
    </div>
  </div>

  <!-- Modal 2 -->
  <div class="modal" id="orderFormModal">
    <div class="modal-content">
      <div class="close-btn" onclick="document.getElementById('orderFormModal').style.display='none'">&times;</div>
      <div class="form-modal-body">
        <h3>Confirm Order</h3>
        <div class="mini-product-card"><img id="miniImg"><div class="mini-card-info"><h4 id="miniTitle"></h4><div id="miniPriceUnit"></div></div></div>
        <div class="qty-row"><span>Quantity:</span><div><button class="qty-btn" onclick="updateQty(-1)">−</button><span id="qtyVal">1</span><button class="qty-btn" onclick="updateQty(1)">+</button></div></div>
        <div class="form-group"><label>Full Name *</label><input type="text" id="custName"></div>
        <div class="form-group"><label>Mobile Number *</label><input type="tel" id="custPhone"></div>
        <div class="form-group"><label>Delivery Address *</label><textarea id="custAddress"></textarea></div>
        <div class="form-group"><label>Pincode *</label><input type="text" id="custPincode"></div>
        <button class="btn-submit-wa" onclick="submitOrder()">Confirm & Order on WhatsApp</button>
      </div>
    </div>
  </div>

  <script>
    const whatsappNum = "919251221747";
    let selectedQuantity = 1;
    const products = { 
      1: { code: "BA-101", title: "Pina Colada Attar 6ml Pack of 2", priceNum: 299, price: "₹299", img: "https://i.ibb.co/4ZwFRcth/Screenshot-2026-0820-184205.jpg", desc: "• Pack: 2 Bottles (6ml each)<br>• Flavour: Strawberry & Pina Colada<br>• Type: Non-Alcoholic Unisex Attar<br>• Shelf Life: 36 Months" } 
    };
    function render() {
        const grid = document.getElementById('productGrid');
        for (let id in products) {
            grid.innerHTML += `<div class="card" onclick="openModal(${id})"><img src="${products[id].img}"><div class="card-info"><h3>${products[id].title}</h3><div class="price">${products[id].price}</div><span class="btn-view">View Details</span></div></div>`;
        }
    }
    function openModal(id) { currentId = id; document.getElementById('mImg').src = products[id].img; document.getElementById('mTitle').innerText = products[id].title; document.getElementById('mPrice').innerText = products[id].price; document.getElementById('mDesc').innerHTML = products[id].desc; document.getElementById('productModal').style.display = 'flex'; }
    function openForm() { document.getElementById('productModal').style.display = 'none'; document.getElementById('orderFormModal').style.display = 'flex'; document.getElementById('miniImg').src = products[currentId].img; document.getElementById('miniTitle').innerText = products[currentId].title; document.getElementById('miniPriceUnit').innerText = products[currentId].price; }
    function updateQty(c) { selectedQuantity = Math.max(1, selectedQuantity + c); document.getElementById('qtyVal').innerText = selectedQuantity; }
    function submitOrder() {
        const p = products[currentId];
        const msg = `*NEW ORDER*\nItem: ${p.title}\nQty: ${selectedQuantity}\nTotal: ₹${p.priceNum * selectedQuantity}\nName: ${document.getElementById('custName').value}\nPhone: ${document.getElementById('custPhone').value}\nAddress: ${document.getElementById('custAddress').value}\n`;
        window.open(`https://wa.me/${whatsappNum}?text=${encodeURIComponent(msg)}`, '_blank');
    }
    let currentId = null;
    render();
  </script>
</body>
</html>
